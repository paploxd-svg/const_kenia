<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Estructura con Columnas</title>
    <style>
        body {
            background-color: #380b2d; /* Fondo púrpura/morado oscuro como el GIF de Millie */
            color: #ffffff;
            margin: 0;
            font-family: sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #5b1248; /* Fondo magenta/morado de la cabecera */
            padding: 10px 20px;
        }

        /* Estilo para controlar el tamaño fijo del logotipo pequeño */
        .logo-pequeno {
            width: 50px;
            /* Ajusta el tamaño que desees */
            height: auto;
            display: block;
        }

        /* Estilo para que la imagen de la cabecera sea responsiva y no se desborde */

        .logo-cabecera {
            max-width: 15%;
            height: auto;
            display: block;
            margin-bottom: 15px;
            /* Espacio entre la imagen y el título */
        }

        .barra-navegacion {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        /* Estilos de botones acordes a la paleta de Millie */
        .boton-nav {
            text-decoration: none;
            color: #ffffff;
            background-color: #d81b60; /* Rojo/Magenta de la piel de Millie */
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-family: sans-serif;
            font-weight: bold;
            transition: background-color 0.3s, color 0.3s;
        }

        .boton-nav:hover {
            background-color: #ffeb3b; /* Amarillo brillante de sus ojos */
            color: #121212;            /* Texto oscuro para contraste */
        }

        .boton-nav.activo {
            background-color: #e91e63; /* Rosa/Magenta neón para la pestaña activa */
            color: #ffffff;
            font-weight: bold;
        }

        main {
            display: flex;
            gap: 0; /* Sin espacio directo para emular el contorno continuo */
        }

        aside {
            width: 25%;
            background-color: #24071d; /* Negro/Púrpura muy oscuro del traje/cuernos */
            padding: 20px;
            color: #ffffff;
            text-align: center; /* Alinea los elementos al centro como en la imagen de referencia */
            box-sizing: border-box;
        }

        .imagen-lateral {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 15px;
        }

        section {
            width: 75%;
            background-color: #4a0f3b; /* Púrpura intermedio del fondo */
            padding: 40px 20px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            box-sizing: border-box;
        }

        /* Tarjeta contenedora blanca para el contenido central como en la imagen */
        article {
            background-color: #ffffff;
            color: #121212;
            padding: 30px;
            border-radius: 8px;
            width: 80%;
            max-width: 650px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        /* Estilo para la imagen dentro del artículo principal */
        .imagen-articulo {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 15px 0;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1 style="margin: 0; color: #ff4081;">Mi Sitio Web</h1>
            <nav class="barra-navegacion">
                <a href="semantica.html" class="boton-nav">YUJI ITADORI</a>
                <a href="semantica2.html" class="boton-nav">SATORU GOJO</a>
                <a href="semantica3.html" class="boton-nav activo">ALASTOR</a>

            </nav>
        </div>
        <img src="imagen/milie.gif" alt="Logo de Mi Sitio Web" class="logo-cabecera">
    </header>
    <main>
        <aside>
            <h3>Barra Lateral</h3>
            <p>Enlaces, publicidad o categorías.</p>
            <img src="imagen/image_5c5996.jpg" alt="Alastor" class="imagen-lateral">
        </aside>
        <section>
            <article>
                <h2>Artículo Principal</h2>
                <p>Contenido del artículo...</p>
                <!-- Imagen agregada dentro del artículo principal -->
                <img src="imagen/alastor2.jpg" alt="Alastor" class="imagen-articulo">
            </article>
        </section>
    </main>

    <footer>
        <p style="color: #ff4081;">Pie de página</p>
    </footer>

</body>

</html>
